<!DOCTYPE html>
<html>
<head>

    <title>Employee Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        /* Header */

        .header {
            background-color: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        /* Main container */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        /* Cards */

        .card {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Form */

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* Buttons */

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 3px;
        }

        .add-btn {
            background-color: #2563eb;
            color: white;
        }

        .add-btn:hover {
            background-color: #1d4ed8;
        }

        .refresh-btn {
            background-color: #374151;
            color: white;
            margin-bottom: 15px;
        }

        .refresh-btn:hover {
            background-color: #111827;
        }

        .update-btn {
            background-color: #f59e0b;
            color: white;
        }

        .delete-btn {
            background-color: #dc2626;
            color: white;
        }

        .update-btn:hover {
            background-color: #d97706;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }

        /* Table */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #1f2937;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        /* Footer */

        .footer {
            text-align: center;
            padding: 20px;
            color: #6b7280;
            font-size: 14px;
        }

    </style>

</head>


<body>


    <!-- Header -->

    <div class="header">

        <h1>Employee Management System</h1>

        <p>Manage your employees easily</p>

    </div>


    <div class="container">


        <!-- Add Employee -->

        <div class="card">

            <h2>Add Employee</h2>

            <div class="form-row">

                <input
                    type="text"
                    id="name"
                    placeholder="Employee Name"
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department"
                >

                <button
                    class="add-btn"
                    onclick="addEmployee()"
                >
                    Add Employee
                </button>

            </div>

        </div>


        <!-- Employee List -->

        <div class="card">

            <h2>Employee List</h2>

            <button
                class="refresh-btn"
                onclick="getEmployees()"
            >
                Refresh Employees
            </button>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Department</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="employeeTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <div class="footer">

        Employee Management System | Spring Boot + MySQL

    </div>



    <script>


        // =========================
        // GET ALL EMPLOYEES
        // =========================

        function getEmployees() {

            fetch('/employees')

                .then(response => response.json())

                .then(employees => {

                    let table =
                        document.getElementById("employeeTable");

                    table.innerHTML = "";


                    employees.forEach(employee => {

                        table.innerHTML += `

                            <tr>

                                <td>${employee.id}</td>

                                <td>${employee.name}</td>

                                <td>${employee.email}</td>

                                <td>${employee.department}</td>

                                <td>

                                    <button
                                        class="update-btn"
                                        onclick="updateEmployee(${employee.id})"
                                    >
                                        Update
                                    </button>

                                    <button
                                        class="delete-btn"
                                        onclick="deleteEmployee(${employee.id})"
                                    >
                                        Delete
                                    </button>

                                </td>

                            </tr>

                        `;

                    });

                });

        }



        // =========================
        // ADD EMPLOYEE
        // =========================

        function addEmployee() {

            let name =
                document.getElementById("name").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let department =
                document.getElementById("department").value.trim();


            // Validation

            if (name === "" || email === "" || department === "") {

                alert("Please fill all fields.");

                return;

            }


            let employee = {

                name: name,

                email: email,

                department: department

            };


            fetch('/employees', {

                method: 'POST',

                headers: {

                    'Content-Type': 'application/json'

                },

                body: JSON.stringify(employee)

            })

            .then(response => response.json())

            .then(data => {

                alert("Employee added successfully!");


                document.getElementById("name").value = "";

                document.getElementById("email").value = "";

                document.getElementById("department").value = "";


                getEmployees();

            });

        }



        // =========================
        // DELETE EMPLOYEE
        // =========================

        function deleteEmployee(id) {

            let confirmDelete =
                confirm("Are you sure you want to delete this employee?");


            if (!confirmDelete) {

                return;

            }


            fetch('/employees/' + id, {

                method: 'DELETE'

            })

            .then(() => {

                alert("Employee deleted successfully!");

                getEmployees();

            });

        }



        // =========================
        // UPDATE EMPLOYEE
        // =========================

        function updateEmployee(id) {

            let name =
                prompt("Enter new name:");

            if (name === null) {

                return;

            }


            let email =
                prompt("Enter new email:");

            if (email === null) {

                return;

            }


            let department =
                prompt("Enter new department:");

            if (department === null) {

                return;

            }


            let employee = {

                id: id,

                name: name,

                email: email,

                department: department

            };


            fetch('/employees', {

                method: 'PUT',

                headers: {

                    'Content-Type': 'application/json'

                },

                body: JSON.stringify(employee)

            })

            .then(response => response.json())

            .then(data => {

                alert("Employee updated successfully!");

                getEmployees();

            });

        }



        // =========================
        // LOAD EMPLOYEES
        // =========================

        getEmployees();


    </script>


</body>

</html>
